[project]
name = "crecere-humanos-vs-ia"
version = "0.1.0"
description = "Comparación de gestiones de cobranza humanas vs agentes de IA"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",   # fisher_exact, hypergeom, mannwhitneyu y cdist
    "jinja2>=3.1",   # el HTML se renderiza desde plantilla + results.json, nunca a mano
]

# La transcripción usa el binario externo whisper-cli (Homebrew) y la extracción el
# CLI de Claude Code: ninguno de los dos es una dependencia de Python.

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
